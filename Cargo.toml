[package]
name = "upp"
version = "0.2.1"
edition = "2024"
authors = [ "alemi <me@alemi.dev>" ]
description = "A simple, batteries-included, selfhosted uptime monitor for your infra"
license = "GPL-3.0"
repository = "https://github.com/alemidev/upp"
readme = "README.md"
keywords = ["selfhosted", "uptime", "all-in-one"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tokio = { version = "1.46", features = ["rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
rusqlite = "0.37"
thiserror = "2.0"
serde_json = "1.0"
async-recursion = "1.1"

[features]
default = []
bundled = ["rusqlite/bundled"]
multi-thread = ["tokio/rt-multi-thread", "tokio/time"]
